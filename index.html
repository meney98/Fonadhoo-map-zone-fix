<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fonadhoo Map</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#fff;overflow:hidden}
#bar{position:fixed;z-index:20;top:10px;left:10px;right:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#search{flex:1;min-width:0;max-width:430px;padding:11px 12px;font-size:16px;border:1px solid #333;border-radius:9px;background:#fff}
button{min-height:44px;padding:9px 12px;border:1px solid #333;border-radius:9px;background:#fff;font-size:14px}
#zones{flex-basis:100%;display:flex;gap:4px;flex-wrap:wrap;margin-top:-2px}#zones button{min-height:26px;padding:3px 7px;font-size:10px;border-radius:6px;border:1px solid #999;background:#fff}#zones button.active{font-weight:bold;border-color:#111}#results{position:fixed;z-index:25;top:90px;left:10px;width:min(430px,calc(100% - 20px));max-height:42vh;overflow:auto;background:white;border:1px solid #bbb;border-radius:9px;display:none}
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;border-radius:0;padding:11px 12px;background:#fff}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#fff}
#stage{position:absolute;left:0;top:0;width:14400px;height:11883px;transform-origin:0 0}
#svgHost{position:absolute;inset:0;width:14400px;height:11883px}#svgHost svg{width:14400px;height:11883px;display:block}#svgHost .editable-block{cursor:pointer}#svgHost .editable-block:focus{outline:none}#svgHost .editable-block.block-selected{fill:#64cfff!important;fill-opacity:.88!important;stroke:inherit!important}
.hit{position:absolute;border:0;background:transparent;padding:0;min-height:0;border-radius:0;cursor:pointer}
.hit.selected{outline:none;background:transparent}
#card{position:fixed;z-index:30;left:10px;right:10px;bottom:10px;max-width:440px;margin:auto;background:#fff;border:1px solid #333;border-radius:12px;padding:14px;display:none;box-shadow:0 2px 12px #0003}
#card h3{margin:0 36px 10px 0;font-size:18px}.row{font-size:14px;margin:5px 0}.muted{color:#666}
#close{position:absolute;right:8px;top:8px;border:0;min-height:36px;padding:5px 10px;font-size:20px}
</style></head>
<body>
<div id="bar"><input id="search" autocomplete="off" placeholder="Search house name"><button id="reset">Reset</button><div id="zones"><button type="button" data-zone="PH">PH</button><button type="button" data-zone="SS01">SS01</button><button type="button" data-zone="SS02">SS02</button><button type="button" data-zone="SS03">SS03</button><button type="button" data-zone="SS04">SS04</button><button type="button" data-zone="SS05">SS05</button><button type="button" data-zone="SS06">SS06</button><button type="button" data-zone="SS07">SS07</button></div></div>
<div id="results"></div>
<div id="viewport"><div id="stage"><div id="svgHost" style="position:absolute;inset:0;width:14400px;height:11883px"></div><div id="hits"></div></div></div>
<div id="card"><button id="close" aria-label="Close">×</button><h3 id="houseName"></h3>
<div class="row"><b>Block ID:</b> <span id="blockId" class="muted">—</span></div><div class="row"><b>House number:</b> <span class="muted">—</span></div>
<div class="row"><b>Area / SS:</b> <span class="muted">—</span></div>
<div class="row"><b>Feeder number:</b> <span class="muted">—</span></div>
<div class="row"><b>Distribution box:</b> <span class="muted">—</span></div>
<div class="row"><b>Breaker number:</b> <span class="muted">—</span></div>
<div class="row"><b>Meter number:</b> <span class="muted">—</span></div></div>
<script src="data.js"></script>
<script>
window.HOUSE_INFO={}; window.BLOCK_INFO={}; window.ZONE_INFO={};

async function loadJSON(url, fallback={}){
  try{ const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error(url); return await r.json(); }
  catch(e){ return fallback; }
}
(async()=>{
  const [houses,houseNames,houseDetails,blocks,blockNames,blockDetails,zones]=await Promise.all([
    loadJSON("houses.json",{}),
    loadJSON("house_names_edit.json",{}),
    loadJSON("house_information_edit.json",{}),
    loadJSON("blocks.json",{}),
    loadJSON("block_names_edit.json",{}),
    loadJSON("block_information_edit.json",{}),
    loadJSON("zones.json",{})
  ]);

  // HOUSE NAME + HOUSE INFORMATION edit files
  for(const [key,row0] of Object.entries(houses)){
    const row={...(row0||{}),...(houseDetails[key]||{})};
    if(Object.prototype.hasOwnProperty.call(houseNames,key)) row.displayName=String(houseNames[key]??"").trim() || key;
    window.HOUSE_INFO[key]=row;
  }
  // Also allow a new permanent house key added directly to the edit files.
  for(const key of new Set([...Object.keys(houseNames),...Object.keys(houseDetails)])){
    if(window.HOUSE_INFO[key]) continue;
    window.HOUSE_INFO[key]={...(houseDetails[key]||{}),displayName:String(houseNames[key]??key).trim()||key};
  }

  // BLOCK NAME + BLOCK INFORMATION edit files
  for(const [id,row0] of Object.entries(blocks)){
    const row={...(row0||{}),...(blockDetails[id]||{})};
    if(Object.prototype.hasOwnProperty.call(blockNames,id)) row.houseName=String(blockNames[id]??"").trim();
    window.BLOCK_INFO[id]=row;
  }
  for(const id of new Set([...Object.keys(blockNames),...Object.keys(blockDetails)])){
    if(window.BLOCK_INFO[id]) continue;
    window.BLOCK_INFO[id]={...(blockDetails[id]||{}),houseName:String(blockNames[id]??"").trim()};
  }

  window.ZONE_INFO=zones;
  window.dispatchEvent(new Event("house-info-loaded"));
  window.dispatchEvent(new Event("block-info-loaded"));
  window.dispatchEvent(new Event("zone-info-loaded"));
})();
</script>
<script src="script.js"></script></body></html>
